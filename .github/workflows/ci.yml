name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders only; no real project access in CI.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Secret scan
        run: node scripts/scan-secrets.mjs
      - name: Dependency audit (production, high and above)
        run: pnpm audit --prod --audit-level=high
      - name: Dependency audit (all, informational)
        run: pnpm audit --audit-level=high || echo "::warning::dev-only advisories remain (see docs/security.md)"
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - name: Unit, migration, RLS and backup/restore tests
        run: pnpm test
      - run: pnpm build
