<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="นักเดินป่ากำลังก้าวเดิน">
  <style>
    .hiker { animation: rise 1.35s ease-in-out infinite; }
    .rear-thigh { transform-origin: 64px 73px; animation: rear-stride 1.35s ease-in-out infinite; }
    .rear-shin { transform-origin: 51px 91px; animation: rear-knee 1.35s ease-in-out infinite; }
    .lead-thigh { transform-origin: 70px 73px; animation: lead-stride 1.35s ease-in-out infinite; }
    .lead-shin { transform-origin: 79px 90px; animation: lead-knee 1.35s ease-in-out infinite; }
    .pole-arm { transform-origin: 77px 51px; animation: plant 1.35s ease-in-out infinite; }
    .shadow { transform-origin: 65px 117px; animation: shadow-shift 1.35s ease-in-out infinite; }
    @keyframes rise { 0%, 100% { transform: translateY(0); } 25%, 75% { transform: translateY(-2px); } 50% { transform: translateY(-3px); } }
    @keyframes rear-stride { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(11deg); } }
    @keyframes rear-knee { 0%, 100% { transform: rotate(7deg); } 45% { transform: rotate(-13deg); } }
    @keyframes lead-stride { 0%, 100% { transform: rotate(10deg); } 50% { transform: rotate(-10deg); } }
    @keyframes lead-knee { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(14deg); } }
    @keyframes plant { 0%, 100% { transform: rotate(7deg); } 50% { transform: rotate(-6deg); } }
    @keyframes shadow-shift { 0%, 100% { transform: scaleX(1); opacity: .2; } 50% { transform: scaleX(.78); opacity: .12; } }
    @media (prefers-reduced-motion: reduce) {
      .hiker, .rear-thigh, .rear-shin, .lead-thigh, .lead-shin, .pole-arm, .shadow { animation: none; }
    }
  </style>
  <ellipse class="shadow" cx="65" cy="117" rx="29" ry="3.5" fill="#111915"/>
  <g class="hiker" fill="#111915" stroke="#111915" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hip and knee joints animate separately while each boot stays attached. -->
    <g class="rear-thigh">
      <path d="M64 73 51 91" fill="none" stroke-width="11"/>
      <g class="rear-shin">
        <path d="M51 91 37 106" fill="none" stroke-width="11"/>
        <path d="M37 107h12" fill="none" stroke-width="9"/>
      </g>
    </g>
    <g class="lead-thigh">
      <path d="M70 73 79 90" fill="none" stroke-width="11"/>
      <g class="lead-shin">
        <path d="M79 90 84 106" fill="none" stroke-width="11"/>
        <path d="M84 107h14" fill="none" stroke-width="9"/>
      </g>
    </g>
    <rect x="29" y="40" width="29" height="37" rx="8" stroke="none"/>
    <rect x="34" y="34" width="20" height="12" rx="5" stroke="none"/>
    <rect x="24" y="56" width="9" height="17" rx="4" stroke="none"/>
    <path d="M49 45c6-5 11-6 17-3" fill="none" stroke-width="5"/>
    <path d="M67 34v11" fill="none" stroke-width="8"/>
    <circle cx="69" cy="27" r="10" stroke="none"/>
    <path d="M57 21c3-10 21-11 25 0l2 4H55z" stroke="none"/>
    <path d="M55 26h33" fill="none" stroke-width="4"/>
    <path d="M55 45c5-6 14-7 20-2l7 12c3 5 2 11-2 15l-9 9-14-5c-4-7-6-18-2-29z" stroke="none"/>
    <path d="M57 52 52 73 43 83" fill="none" stroke-width="7"/>
    <circle cx="43" cy="83" r="4" stroke="none"/>
    <g class="pole-arm">
      <path d="M75 51 81 69 92 65" fill="none" stroke-width="7"/>
      <circle cx="92" cy="65" r="4.5" stroke="none"/>
      <path d="M94 62 106 114" fill="none" stroke-width="4"/>
      <path d="M94 62 95 57" fill="none" stroke-width="4"/>
      <path d="M101 114h10" fill="none" stroke-width="3"/>
    </g>
  </g>
</svg>
